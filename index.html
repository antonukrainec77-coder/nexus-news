<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS — AI, Technology, Space, Crypto & Weird News</title><meta id="metaDesc" name="description" content="NEXUS covers AI, technology, space, crypto, internet culture and strange stories."><meta id="canonical" rel="canonical" href=""><meta id="ogTitle" property="og:title" content="NEXUS — AI, Technology, Space, Crypto & Weird News"><meta id="ogDesc" property="og:description" content="Latest AI, technology, space, crypto and internet news."><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta id="jsonld" type="application/ld+json"><style>
:root{--bg:#07090e;--panel:#10141c;--line:#252d3a;--text:#f6f7fb;--muted:#8e99aa;--a:#7280ff;--max:1240px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:var(--max);margin:auto;padding:0 20px}.header{position:sticky;top:0;z-index:10;background:#07090eea;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.head{height:70px;display:flex;align-items:center;gap:24px}.logo{font-weight:950;font-size:27px;letter-spacing:.1em}.logo span{color:var(--a)}.nav{display:flex;gap:18px;overflow:auto;white-space:nowrap}.nav a{color:#aeb7c5;font-weight:700}.nav a:hover{color:#fff}.search{margin-left:auto;background:#10151e;border:1px solid var(--line);border-radius:9px;color:#fff;padding:9px 11px;width:190px}.hero{padding:34px 0 22px}.ad{min-height:90px;border:1px dashed #303948;background:#0c1017;border-radius:10px;display:grid;place-items:center;color:#596578;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0}.heroGrid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.heroCard,.card,.sidebox{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.heroImg{height:390px;background:linear-gradient(135deg,#18203d,#111723);display:grid;place-items:center;color:#64708a}.heroImg img,.thumb img{width:100%;height:100%;object-fit:cover}.heroText{padding:22px}.eyebrow{color:#8593ff;text-transform:uppercase;font-size:11px;letter-spacing:.14em;font-weight:900}.hero h1{font-size:38px;line-height:1.05;margin:10px 0}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}.section{margin:26px 0}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section h2{font-size:22px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding-bottom:16px}.thumb{height:180px;background:#151b25}.cardBody{padding:15px}.card h3{margin:7px 0 8px;font-size:19px;line-height:1.15}.sidebox{padding:16px;margin-bottom:14px}.trend{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.trend:last-child{border-bottom:0}.num{font-size:25px;font-weight:950;color:#6f7cff}.article{display:none;max-width:900px;margin:35px auto}.article h1{font-size:44px;line-height:1.05}.articleImg{max-height:500px;width:100%;object-fit:cover;border-radius:14px}.articleBody{font-size:18px;line-height:1.7}.back{display:inline-block;margin-bottom:15px;color:#8794ff}.empty{padding:35px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);margin-top:45px}@media(max-width:900px){.heroGrid,.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.search{display:none}}@media(max-width:600px){.wrap{padding:0 14px}.head{gap:13px}.nav{gap:12px}.hero h1{font-size:30px}.heroImg{height:240px}.grid{grid-template-columns:1fr}.article h1{font-size:34px}}
</style></head><body><header class="header"><div class="wrap head"><a class="logo" href="#">NEX<span>US</span></a><nav id="nav" class="nav"></nav><input id="search" class="search" placeholder="Search..."></div></header><main class="wrap"><div id="adTop" class="ad">TOP AD</div><section id="home"><section class="hero"><div id="heroGrid" class="heroGrid"></div></section><div class="layout"><div><div id="sections"></div></div><aside><div id="adSide" class="ad">SIDEBAR AD</div><div class="sidebox"><div class="sectionHead"><h2>Trending</h2></div><div id="trending"></div></div><div id="adSide2" class="ad">SIDEBAR AD</div></aside></div></section><article id="article" class="article"></article><div id="adArticle" class="ad">ARTICLE AD</div><div id="adBottom" class="ad">BOTTOM AD</div></main><footer><div class="wrap">© 2026 NEXUS · AI · Technology · Space · Crypto · Internet · Weird Stories</div></footer>
<script>
const URL='https://bqsnpmzrphkjlqekjtpd.supabase.co';const KEY='sb_publishable_wABgRwypki2fYTerOxsgwg_xJ9ttYWa';let cats=[],news=[],settings={};async function rest(path){const r=await fetch(URL+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Supabase HTTP '+r.status+': '+await r.text());return r.json()}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function placeholder(title,cat){const label=(cat||'NEXUS').toUpperCase();const t=String(title||'NEXUS').replace(/[&<>]/g,'').slice(0,44);const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 700'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='#111827'/><stop offset='.55' stop-color='#303a70'/><stop offset='1' stop-color='#111827'/></linearGradient></defs><rect width='1200' height='700' fill='url(#g)'/><circle cx='1010' cy='130' r='170' fill='#7280ff' opacity='.12'/><circle cx='180' cy='590' r='220' fill='#7280ff' opacity='.08'/><text x='70' y='110' fill='#9aa6ff' font-family='Arial' font-size='30' font-weight='700' letter-spacing='5'>${label}</text><text x='70' y='620' fill='white' font-family='Arial' font-size='42' font-weight='700'>${t}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function imageProxy(url){if(!url||!/^https?:\/\//i.test(url))return '';return 'https://bqsnpmzrphkjlqekjtpd.supabase.co/functions/v1/image-proxy?url='+encodeURIComponent(url)+'&v=3'}
function img(url,title,cat){const fallback=placeholder(title,cat);if(!url)return `<img src="${esc(fallback)}" loading="lazy">`;const proxy=imageProxy(url);return `<img src="${esc(proxy)}" referrerpolicy="no-referrer" data-fallback="${esc(fallback)}" loading="lazy" onerror="this.onerror=null;this.src=this.dataset.fallback;">` }
async function init(){try{const [c,n,set]=await Promise.all([rest('categories?select=*&order=sort_order.asc'),rest('news?select=*&status=eq.published&order=published_at.desc&limit=80'),rest('site_settings?select=*&key=eq.seo')]);cats=c||[];settings=set?.[0]?.value||{};applySEO();const cmap=Object.fromEntries(cats.map(c=>[c.id,c]));news=(n||[]).map(x=>({...x,categories:cmap[x.category_id]||null}));if(!cats.length)throw new Error('No categories returned');if(!news.length){$('sections').innerHTML='<div class="empty">News database is connected, but no published news were returned.</div>';return}render()}catch(e){console.error('NEXUS data error',e);$('sections').innerHTML='<div class="empty">NEXUS could not connect to the news database. '+esc(e.message)+'</div>';}}
setInterval(init,60000);
function applySEO(){const title=settings.title||'NEXUS — AI, Technology, Space, Crypto & Weird News';const desc=settings.description||'NEXUS covers AI, technology, space, crypto, internet culture and strange stories.';document.title=title;$('metaDesc').content=desc;$('ogTitle').content=title;$('ogDesc').content=desc}function render(){const nav=$('nav');nav.innerHTML=cats.map(c=>`<a href="#${esc(c.slug)}">${esc(c.name)}</a>`).join('');const hero=news[0];if(hero)$('heroGrid').innerHTML=`<a class="heroCard" href="#article/${hero.slug}"><div class="heroImg">${img(hero.image_url,hero.title,hero.categories?.name)}</div><div class="heroText"><div class="eyebrow">${esc(hero.categories?.name||'NEXUS')}</div><h1>${esc(hero.title)}</h1><p class="muted">${esc(hero.excerpt||'')}</p></div></a><div class="sidebox"><div class="sectionHead"><h2>Latest</h2></div>${news.slice(1,6).map((n,i)=>`<a class="trend" href="#article/${n.slug}"><span class="num">0${i+1}</span><span><b>${esc(n.title)}</b><br><small class="muted">${new Date(n.published_at||n.created_at).toLocaleDateString('en-US')}</small></span></a>`).join('')}</div>`;const sec=$('sections');sec.innerHTML=cats.map(c=>{const arr=news.filter(n=>n.categories?.slug===c.slug).slice(0,6);if(!arr.length)return '';return `<section id="${esc(c.slug)}" class="section"><div class="sectionHead"><h2>${esc(c.name)}</h2><span class="muted">Latest</span></div><div class="grid">${arr.map(n=>card(n)).join('')}</div><div class="ad">CONTENT AD</div></section>`}).join('')||'<div class="empty">No published stories yet.</div>';$('trending').innerHTML=news.slice(0,7).map((n,i)=>`<a class="trend" href="#article/${n.slug}"><span class="num">${String(i+1).padStart(2,'0')}</span><span><b>${esc(n.title)}</b></span></a>`).join('');renderAds()}
function card(n){return `<a class="card" href="#article/${n.slug}"><div class="thumb">${img(n.image_url,n.title,n.categories?.name)}</div><div class="cardBody"><div class="eyebrow">${esc(n.categories?.name||'News')}</div><h3>${esc(n.title)}</h3><p class="muted">${esc(n.excerpt||'')}</p></div></a>`}
async function renderAds(){let slots=[],rot=[],nets=[];try{[slots,rot,nets]=await Promise.all([rest('ad_slots?select=*&enabled=eq.true'),rest('ad_rotations?select=*'),rest('ad_networks?select=*&enabled=eq.true')])}catch(e){return}const nm=Object.fromEntries((nets||[]).map(x=>[x.id,x]));for(const slot of slots){const list=(rot||[]).filter(x=>x.slot_id===slot.id&&nm[x.network_id]);if(!list.length)continue;const total=list.reduce((a,x)=>a+Number(x.weight||0),0);let pick=Math.random()*total,chosen=list[0];for(const x of list){pick-=Number(x.weight||0);if(pick<=0){chosen=x;break}}const net=nm[chosen.network_id];const code=window.matchMedia('(max-width:600px)').matches?(net.mobile_code||net.desktop_code||''):(net.desktop_code||net.mobile_code||'');const box=slot.code==='TOP'?'adTop':slot.code==='BOTTOM'?'adBottom':slot.code==='SIDEBAR'?'adSide':slot.code==='SIDEBAR_2'?'adSide2':null;if(box&&net){$(box).innerHTML=code;trackAd('impression',net.id,slot.id);$(box).onclick=()=>trackAd('click',net.id,slot.id)}if((slot.code==='CONTENT-1'||slot.code==='CONTENT_1')&&net){document.querySelectorAll('.section .ad').forEach((el,i)=>{if(i%2===0){el.innerHTML=code;trackAd('impression',net.id,slot.id);el.onclick=()=>trackAd('click',net.id,slot.id)}})}if((slot.code==='CONTENT-2'||slot.code==='CONTENT_2')&&net){document.querySelectorAll('.section .ad').forEach((el,i)=>{if(i%2===1){el.innerHTML=code;trackAd('impression',net.id,slot.id);el.onclick=()=>trackAd('click',net.id,slot.id)}})}}}
function track(type){const sid=sessionStorage.getItem('nexus_sid')||crypto.randomUUID();sessionStorage.setItem('nexus_sid',sid);fetch(URL+'/rest/v1/visitor_events',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({event_type:type,page_url:location.href,session_id:sid})}).catch(()=>{})}function trackAd(type,n,s){fetch(URL+'/rest/v1/ad_events',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({event_type:type,network_id:n,slot_id:s,page_url:location.href})}).catch(()=>{})}
async function openArticle(slug){const n=news.find(x=>x.slug===slug);if(!n)return;history.replaceState({},'',`#article/${slug}`);$('home').style.display='none';$('article').style.display='block';setArticleSEO(n);$('article').innerHTML=`<a class="back" href="#">← Back to NEXUS</a><div class="eyebrow">${esc(n.categories?.name||'News')}</div><h1>${esc(n.title)}</h1><p class="muted">${new Date(n.published_at||n.created_at).toLocaleString('en-US')} · ${Number(n.views||0)+1} views</p>${img(n.image_url,n.title,n.categories?.name).replace('<img ','<img class="articleImg" ')}<div class="articleBody"><p>${esc(n.excerpt||'')}</p>${String(n.content||'').split(/\n+/).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}</div><p class="muted">Source: <a href="${esc(n.source_url||'#')}" target="_blank" rel="noopener">${esc(n.source_name||'Original source')}</a></p>`;fetch(URL+'/rest/v1/news?id=eq.'+encodeURIComponent(n.id),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({views:Number(n.views||0)+1})}).catch(()=>{});track('pageview');scrollTo({top:0,behavior:'smooth'})}
function setArticleSEO(n){const title=n.seo_title||n.title+' — NEXUS';const desc=n.seo_description||n.excerpt||'Latest news from NEXUS.';document.title=title;$('metaDesc').content=desc;$('ogTitle').content=title;$('ogDesc').content=desc;$('canonical').href=location.href}function route(){const h=location.hash;if(h.startsWith('#article/'))openArticle(decodeURIComponent(h.slice(9)));else{$('home').style.display='block';$('article').style.display='none';applySEO();$('canonical').href=location.href}}addEventListener('hashchange',route);$('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none')};init().then(route);
</script></body></html>

setInterval(()=>init(),60000);
